name: Build and Deploy to ECS

# Deploys on every push to main. Builds both container images, pushes them to
# ECR, and forces the ECS service to pull the new images. No CloudShell needed.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 872709212513.dkr.ecr.us-east-1.amazonaws.com
  CLUSTER: pc-tool-cluster
  SERVICE: pc-tool

permissions:
  id-token: write     # required for OIDC auth to AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Advisory pre-checks — MUST NEVER FAIL THE BUILD ─────────────────
      # History: an earlier version of this step ran `secretsmanager
      # get-secret-value` and did `exit 1` when it came back empty. The deploy
      # role (pc-tool-gh-deploy) only has ECR + ECS access, so that call was
      # AccessDenied — indistinguishable from "empty" — and every deploy failed
      # with "Secret is missing or unreadable" while the secret was perfectly
      # fine. That blocked production for a week.
      #
      # Two rules follow from that:
      #   1. This step is ADVISORY. It reports; it never blocks. `|| true` on
      #      the whole thing so nothing here can gate a deploy.
      #   2. It must never claim "OK" for something it couldn't actually check —
      #      a false reassurance is worse than no check at all.
      #
      # It also uses describe-secret, not get-secret-value: CI has no business
      # reading a database password, only confirming the secret is there.
      - name: Preflight (advisory)
        continue-on-error: true
        run: |
          echo "These checks are advisory — they never block the deploy."
          echo

          echo "── Database secret ──"
          if OUT=$(aws secretsmanager describe-secret \
                     --secret-id pc-tool/database-url \
                     --region "$AWS_REGION" \
                     --query '{name:Name,deleted:DeletedDate}' --output text 2>&1); then
            case "$OUT" in
              *None*) echo "OK — pc-tool/database-url exists." ;;
              *)      echo "::warning::pc-tool/database-url is SCHEDULED FOR DELETION: $OUT" ;;
            esac
          else
            case "$OUT" in
              *ResourceNotFound*)
                echo "::warning::pc-tool/database-url does not exist. The backend"
                echo "will not start without it — see DEPLOYMENT.md § Database password." ;;
              *AccessDenied*|*not\ authorized*)
                echo "Could not verify (deploy role lacks secretsmanager:DescribeSecret)."
                echo "Not a problem with the deploy — the check simply can't run." ;;
              *)
                echo "Could not verify: $OUT" ;;
            esac
          fi
          echo

          echo "── RDS password rotation ──"
          if OUT=$(aws rds describe-db-instances \
                     --db-instance-identifier xponance-db --region "$AWS_REGION" \
                     --query 'DBInstances[0].MasterUserSecret.SecretArn' \
                     --output text 2>&1); then
            if [ "$OUT" = "None" ]; then
              echo "OK — password is static, no rotation to break the deploy."
            else
              echo "::warning::RDS-managed master password is ENABLED. It rotates on a"
              echo "schedule and will break the NEXT deploy after it does, unless"
              echo "pc-tool/database-url is updated to match. Secret: $OUT"
            fi
          else
            echo "Could not verify rotation state (deploy role lacks rds:DescribeDBInstances)."
          fi
          echo
          echo "Preflight done — continuing regardless."

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build -t "$ECR_REGISTRY/pc-tool-backend:latest" ./backend
          docker push "$ECR_REGISTRY/pc-tool-backend:latest"

      - name: Build and push frontend image
        run: |
          docker build -t "$ECR_REGISTRY/pc-tool-frontend:latest" ./frontend
          docker push "$ECR_REGISTRY/pc-tool-frontend:latest"

      - name: Force ECS redeployment
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --query 'service.serviceName' --output text

      - name: Wait for service to stabilize
        id: wait
        run: |
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$AWS_REGION"
          echo "Deployment stable."

      # ── Why this exists ────────────────────────────────────────────────
      # When the waiter above fails it only ever says "Max attempts exceeded",
      # which tells you nothing about the cause. Digging it out by hand means
      # ECS events + stopped-task exit codes + CloudWatch logs. This step does
      # that automatically so the reason is visible right here in the job log —
      # no AWS console needed, no expertise required.
      #
      # Scoped to `steps.wait.conclusion == 'failure'` on purpose: it used to run
      # on ANY failure, so a build error or a failed pre-check would print pages
      # of ECS stability hints that had nothing to do with the actual problem and
      # sent you looking in the wrong place. If the deploy never got as far as
      # waiting, the answer is in the failed step's own output, not here.
      - name: Explain the failure
        if: failure() && steps.wait.conclusion == 'failure'
        run: |
          echo "::group::Deployment state"
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].deployments[].{status:status,rollout:rolloutState,running:runningCount,failed:failedTasks,reason:rolloutStateReason}' \
            --output table || true
          echo "::endgroup::"

          echo "::group::Recent service events"
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].events[:8].[createdAt,message]' --output text || true
          echo "::endgroup::"

          echo "::group::Why the last tasks stopped (exit codes)"
          STOPPED=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" \
            --desired-status STOPPED --region "$AWS_REGION" \
            --query 'taskArns[:3]' --output text || true)
          if [ -n "$STOPPED" ]; then
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks $STOPPED \
              --region "$AWS_REGION" \
              --query 'tasks[].{stopped:stoppedReason,code:stopCode,containers:containers[].{name:name,exit:exitCode,reason:reason}}' \
              --output json || true
          else
            echo "No stopped tasks found."
          fi
          echo "::endgroup::"

          echo "::group::Last 80 log lines"
          aws logs tail /ecs/pc-tool --region "$AWS_REGION" --since 15m 2>/dev/null \
            | tail -80 || echo "Could not read /ecs/pc-tool."
          echo "::endgroup::"

          cat <<'HINT'
          ────────────────────────────────────────────────────────────────
          Common causes, in the order they actually happen:

          1. "password authentication failed for user postgres"
             The DSN in Secrets Manager (pc-tool/database-url) no longer
             matches the RDS master password. The container retries 30× then
             exits 1, so the service never stabilizes.
             Fix: DEPLOYMENT.md § "Database password".

          2. "Task failed ELB health checks"
             The container is slow to boot or pegging the 0.5 vCPU. Check the
             log group above for a traceback.
             Fix: DEPLOYMENT.md §14 (health check + grace period).

          3. Image pull / ECR auth errors
             Re-run the workflow; usually transient.
          ────────────────────────────────────────────────────────────────
          HINT
